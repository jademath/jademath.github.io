name: Sync Google Scholar publications

on:
  schedule:
    # 06:17 China Standard Time; avoid the busy start of the hour.
    - cron: '17 22 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/sync-scholar.yml'
      - 'scripts/sync_scholar.py'
      - 'tests/test_scholar_sync.py'

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-google-scholar
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check parser and data preservation
        run: python -m unittest discover -s tests -p 'test_scholar_sync.py'
      - name: Read complete public Scholar profile
        run: python scripts/sync_scholar.py
      - name: Save verified publications
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _data/scholar_publications.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh publications from Google Scholar'
            git push
          fi
      - name: Rebuild the published website
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$GH_REPO/pages/builds"
